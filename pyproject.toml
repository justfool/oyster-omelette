[project]
name = "oyster-omelette"
version = "0.1.0"
description = "TUI 農家樂（修訂版）。代號 oyster-omelette。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
oyster-omelette = "oyster_omelette:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-bdd>=8.1.0",
    "ruff>=0.16.3",
    "basedpyright",
]

[tool.hatch.build.targets.wheel.force-include]
"src/oyster_omelette/themes/default.json" = "oyster_omelette/themes/default.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
bdd_features_base_dir = "features"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # bugbear
]
ignore = [
    "E501",  # 行長交給 ruff format
]

[tool.ruff.lint.per-file-ignores]
# Card／occupation／minor 先定義，decks 才能引用。
"src/oyster_omelette/cards.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["oyster_omelette"]
